name: Pull ESPN league

on:
  schedule:
    # Tuesday and Wednesday, 9:00 AM Pacific (16:00 UTC)
    - cron: "0 16 * * 2,3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_espn.py
      - name: Save the new data
        run: |
          git config user.name "belt-report-bot"
          git config user.email "belt-report-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ESPN data update"
          git push
